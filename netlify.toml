[build]
  command = "npm run build"
  publish = "dist"

# Branded short link for review requests — /review is now a real static page
# (public/review/index.html) rather than a 301, so the scan fires a GA4
# review_click before bouncing to Google. A 301 was invisible: we could never
# tell "nobody scanned the card" apart from "everybody scanned and nobody
# reviewed". The page self-redirects in ~2s, so the friction cost is ~nil.
#
# The Google destination now lives in that file. Netlify resolves /review to
# /review/index.html automatically, so no explicit rule is needed.
#
# NOTE: the old rule was a 301, which browsers cache indefinitely. Anyone who
# already scanned the card will keep skipping straight to Google. Their reviews
# still land, they just won't show in GA4. Use 302 for anything like this later.

# No SPA catch-all. Every public route is prerendered to its own .html file
# (prerender.mjs), so an unknown URL now gets dist/404.html with a real 404
# status. The old "/* → /index.html 200" rule answered every junk URL with the
# homepage and a 200 — soft 404s that Google can index as homepage duplicates.
# Only the hidden dashboards are client-rendered, so only they get the SPA shell.

# Retired URLs that were once in the sitemap. They used to soft-404 to the
# homepage; send them (and any links they still have) to the closest live page.
[[redirects]]
  from = "/services/womens-cut"
  to = "/services/haircut"
  status = 301

[[redirects]]
  from = "/blog/top-mens-haircut-trends-2025"
  to = "/blog/top-mens-haircut-trends-2026"
  status = 301

[[redirects]]
  from = "/blog/evolution-of-mens-hairstyles"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/haircut-for-your-face-shape"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/quick-fixes-for-bad-hair-days"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/ultimate-hair-product-guide"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/_internal/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # CSP: GA4 + Google Ads + Google Maps embed; inline style/script allowed for
    # React-injected JSON-LD, Tailwind runtime classes, and GA inline bootstrap.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com https://googleads.g.doubleclick.net; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Hidden internal routes — block search indexing at the HTTP level too,
# in case a crawler ignores robots.txt or follows a leaked link.
[[headers]]
  for = "/_internal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
