<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave a Review | Hair Mechanics</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fallback: if JS is off, still land on Google after 3s. -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://g.page/r/Cc2wjU_thhsrEAI/review" />
    </noscript>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C82GRQVLDF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-C82GRQVLDF');
    </script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Oswald', 'Helvetica Neue', Arial, sans-serif;
        background: #1A1A1A; color: #fff;
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .wrap { max-width: 380px; }
      .logo { width: 72px; height: 72px; border-radius: 12px; margin: 0 auto 24px; display: block; }
      h1 { font-size: 26px; text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; }
      .gold { color: #C99A22; }
      .stars { color: #C99A22; font-size: 24px; letter-spacing: 6px; margin: 12px 0 20px; }
      p { color: #b8b8b8; font-size: 15px; line-height: 1.5; }
      .go {
        display: inline-block; margin-top: 24px; background: #C99A22; color: #1A1A1A;
        padding: 14px 28px; border-radius: 8px; font-weight: 700; font-size: 16px;
        text-decoration: none; letter-spacing: .5px;
      }
      .sending { margin-top: 18px; font-size: 13px; color: #777; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/assets/Logo.png" alt="Hair Mechanics" />
      <h1>Thanks for coming in.<br /><span class="gold">Mind leaving a review?</span></h1>
      <div class="stars">★ ★ ★ ★ ★</div>
      <p>Takes about 20 seconds. It's the single biggest thing that helps people in Auburn find the shop.</p>


      <a class="go" id="go" href="https://g.page/r/Cc2wjU_thhsrEAI/review">Write my review →</a>
      <div class="sending" id="sending">Taking you to Google…</div>
    </div>

    <script>
      (function () {
        var DEST = 'https://g.page/r/Cc2wjU_thhsrEAI/review';
        var params = new URLSearchParams(window.location.search);
        // ?src=qr on the printed card, ?src=sms in follow-up texts — lets us see
        // which channel actually produces reviews instead of guessing.
        var src = params.get('src') || 'direct';

        gtag('event', 'review_click', { method: 'google', source: src });

        var jumped = false;
        function jump() {
          if (jumped) return;
          jumped = true;
          window.location.replace(DEST);
        }

        // Give the beacon a moment to leave, then go. Manual tap short-circuits it.
        document.getElementById('go').addEventListener('click', function (e) {
          e.preventDefault();
          jump();
        });
        setTimeout(jump, 2200);
      })();
    </script>
  </body>
</html>
